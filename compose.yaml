name: maple-harbour-bank
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true
  restart: unless-stopped
  mem_limit: 512m
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: mhb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap.py}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mhb']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 1g
  migrate:
    <<: *backend
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db/mhb
      API_PASSWORD: ${API_PASSWORD}
      WORKER_PASSWORD: ${WORKER_PASSWORD}
    command: ['sh','-c','python -m mhb.migrate && python /scripts/create_service_users.py && python -m mhb.seed']
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    environment:
      DATABASE_URL: postgresql://mhb_api_login:${API_PASSWORD}@db/mhb
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_AUTH: ${DEMO_AUTH:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-maple-harbour}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    healthcheck:
      test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health/ready", timeout=2)']
      interval: 5s
      retries: 10
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *backend
    environment:
      WORKER_DATABASE_URL: postgresql://mhb_worker_login:${WORKER_PASSWORD}@db/mhb
    command: ['python','-m','mhb.pipeline']
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    ports: ['127.0.0.1:8080:8080']
    mem_limit: 128m
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  pgdata:
