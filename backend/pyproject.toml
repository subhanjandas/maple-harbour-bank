[project]
name = "maple-harbour-bank"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.3", "uvicorn==0.54.0", "psycopg[binary,pool]==3.3.6",
  "authlib==1.9.1", "httpx==0.28.1", "itsdangerous==2.2.0",
  "pydantic==2.14.1", "prometheus-client==0.25.0"
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "pip-audit==2.9.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
